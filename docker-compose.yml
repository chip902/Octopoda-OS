services:
  api:
    build: .
    ports:
      - "8443:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - OCTOPODA_CIRCUIT_BREAKER_DEFAULT_USD_PER_MIN=100.0
      - OCTOPODA_CIRCUIT_BREAKER_DISABLED=1
      - SYNRIX_BACKEND=${SYNRIX_BACKEND:-sqlite}
      - SYNRIX_DATA_DIR=/data
      - SYNRIX_LOG_LEVEL=${SYNRIX_LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    volumes:
      - synrix-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "8008:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  synrix-data:
